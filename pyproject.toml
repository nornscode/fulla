[project]
name = "fulla"
version = "0.1.0"
description = "A private personal manager on Norns. Keeps your commitments, facts and mornings; talks to you on Telegram, Signal or by text."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "norns-sdk>=0.11.2",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "icalendar>=6",
    "recurring-ical-events>=3",
    "websockets>=17.2",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.414",
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
fulla = "fulla.main:main"
fulla-serve = "fulla.main:serve_main"
fulla-mac = "fulla.mac.worker:main"
fulla-host = "fulla.host:main"
fulla-register = "fulla.register:main"
fulla-register-channel = "fulla.register_channel:main"
fulla-feedback = "fulla.review:main"
fulla-soul = "fulla.soul:main"
fulla-signal-secret = "fulla.signature:print_signal_secret"
fulla-eval = "fulla.evals:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Broad excepts sit at thread and network boundaries on purpose: log, carry on.
ignore = ["BLE001"]

[tool.pyright]
include = ["fulla", "norns_app", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
# Tests hand duck-typed fakes to typed parameters and use Optional lookups
# (`in agent.allowed_tools`, `store.get(x).name`) they have just populated;
# the rules for those two habits are off there, and only there.
executionEnvironments = [
    # messages.py takes `tool` from norns, not fulla.tooldef, whose overloads fix the
    # decorator's type; the one rule that trips on that is off there, and only there.
    { root = "fulla/tools/messages.py", reportCallIssue = false },
    { root = "tests", reportArgumentType = false, reportOptionalMemberAccess = false, reportOptionalSubscript = false, reportOptionalIterable = false, reportOperatorIssue = false },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fulla", "norns_app"]
